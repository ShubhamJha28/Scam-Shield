services:
  # 1. Next.js Frontend Deployment
  - type: web
    name: scamshield-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://scam-shield-9w1h.onrender.com

  # 2. Python FastAPI Backend Deployment
  - type: web
    name: scamshield-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard
